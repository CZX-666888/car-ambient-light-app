workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.carambient.carambientlight"
        APP_NAME: "Car Ambient Light"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "Q3SD5836YH"
        APP_STORE_CONNECT_ISSUER_ID: "2c6d7ea1-e05d-49a3-b812-545ef1efcbbc"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgwMJ+D8QA7XIweFIe
          u4m3vGIv2ItACMYmzElvkgFx4BOgCgYIKoZIzj0DAQehRANCAAQlI5bm1fJIfQyo
          7nug9FDNb6Z2yO+Tdh5M9YwQkQTRqBGuIoGa7Nq4FKJIooziqKRv0HMjhozR7FP9
          QRyGGunM
          -----END PRIVATE KEY-----
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: |
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd $CM_BUILD_DIR/ios
          pod install
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          flutter build ipa --release \
            --export-options-plist=$CM_EXPORT_DIR/export_options.plist
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/export_options.plist
